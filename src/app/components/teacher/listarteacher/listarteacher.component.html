<div class="table-container">
  <h1>Lista de Profesores</h1>
  <div class="mat-table-wrapper">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <!-- Position Column -->
      <ng-container matColumnDef="c1">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let element">
          {{ element.IdTeacherProfile }}
        </td>
      </ng-container>

      <!-- Specialist Column -->
      <ng-container matColumnDef="c2">
        <th mat-header-cell *matHeaderCellDef>Especialidad</th>
        <td mat-cell *matCellDef="let element">
          {{ element.SpecialistTeacherProfile }}
        </td>
      </ng-container>

      <!-- ExperienceTeacherProfile Column -->
      <ng-container matColumnDef="c3">
        <th mat-header-cell *matHeaderCellDef>Experiencia</th>
        <td mat-cell *matCellDef="let element">
          {{ element.ExperienceTeacherProfile }}
        </td>
      </ng-container>

      <!-- DescriptionTeacherProfile Column -->
      <ng-container matColumnDef="c4">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let element">
          {{ element.DescriptionTeacherProfile }}
        </td>
      </ng-container>

      <!-- AverageGradeTeacherProfile Column -->
      <ng-container matColumnDef="c5">
        <th mat-header-cell *matHeaderCellDef>Nota Promedio</th>
        <td mat-cell *matCellDef="let element">
          {{ element.AverageGradeTeacherProfile }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
